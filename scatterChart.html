<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ECharts Scatter Example</title>

<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>

<style>

body{
    margin:0;
    font-family:Arial;
}

#chart{
    width:100%;
    height:700px;
}

</style>

</head>

<body>

<div id="chart"></div>


<script>


const chart = echarts.init(
    document.getElementById("chart")
);



const data = [

{
    name:"México",
    value:[
        13000,   // PIB
        76,      // Vida
        128000000 // población
    ]
},

{
    name:"Estados Unidos",
    value:[
        70000,
        78,
        331000000
    ]
},

{
    name:"Japón",
    value:[
        42000,
        84,
        125000000
    ]
},

{
    name:"Alemania",
    value:[
        50000,
        81,
        83000000
    ]
},

{
    name:"Brasil",
    value:[
        10000,
        75,
        215000000
    ]
}

];



const option = {


title:{
    text:"PIB vs Esperanza de vida"
},


tooltip:{


    formatter:function(params){

        return `
        <b>${params.name}</b><br>
        PIB: ${params.value[0]} USD<br>
        Vida: ${params.value[1]} años<br>
        Población: ${params.value[2]}
        `;

    }

},



xAxis:{

    name:"PIB per capita",
    
    type:"value",

},



yAxis:{

    name:"Esperanza de vida",

    type:"value"

},



series:[{


    type:"scatter",


    data:data,


    symbolSize:function(value){

        return Math.sqrt(value[2]) / 100;

    },


    itemStyle:{

        color:function(params){

            const colors=[
                "#5470c6",
                "#91cc75",
                "#fac858",
                "#ee6666",
                "#73c0de"
            ];

            return colors[params.dataIndex];

        }

    },


    emphasis:{

        scale:true

    },


    animationDuration:2000


}]

};



chart.setOption(option);



window.addEventListener(
"resize",
()=>{
    chart.resize();
});


</script>


</body>
</html>
