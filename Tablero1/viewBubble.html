<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bubble Chart</title>


    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ECHARTS -->
    <script
        src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js">
    </script>


    <!-- BOOTSTRAP JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {
            overflow-x: hidden;
        }


        /* ==============================
           CONTENEDOR PRINCIPAL
        ============================== */

        .bubble-container {
            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* ==============================
           GRÁFICA
        ============================== */

        #chart {
            width: 100%;
            height: 75vh;
            min-height: 500px;
        }


        /* ==============================
           CONTROLES
        ============================== */

        .controls {
            width: 100%;

            padding:
                10px
                25px
                25px
                25px;

            background: #ffffff;
        }


        .control-row {
            display: flex;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 10px;
        }


        /* ==============================
           BOTONES
        ============================== */

        #play,
        #pause {
            white-space: nowrap;
        }


        /* ==============================
           DROPDOWN ENTIDADES
        ============================== */

        .entity-dropdown-menu {
            width: 300px;

            padding: 12px;

            max-height: 420px;

            overflow: hidden;
        }


        .entity-actions {
            display: flex;

            gap: 5px;

            margin-bottom: 10px;
        }


        .entity-actions button {
            flex: 1;
        }


        #entityList {
            max-height: 270px;

            overflow-y: auto;

            padding-right: 5px;
        }


        .entity-item {
            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                5px
                4px;

            border-radius: 5px;
        }


        .entity-item:hover {
            background: #f4f4f4;
        }


        .entity-item input {
            cursor: pointer;
        }


        .entity-item label {
            width: 100%;

            cursor: pointer;

            margin: 0;

            user-select: none;
        }


        #entityCount {
            font-size: 12px;

            color: #777777;

            margin-top: 8px;
        }


        /* ==============================
           TIEMPO
        ============================== */

        #currentTime {
            min-width: 100px;

            margin-left: 5px;

            font-size: 18px;

            font-weight: 700;

            color: #222222;
        }


        /* ==============================
           TIMELINE
        ============================== */

        #timeline {
            width: 100%;

            cursor: pointer;
        }


        #years {
            position: relative;

            width: 100%;

            height: 35px;

            margin-top: 3px;
        }


        #years span {
            position: absolute;

            top: 0;

            transform:
                translateX(-50%);

            font-size: 12px;

            color: #555555;

            cursor: pointer;

            user-select: none;

            white-space: nowrap;
        }


        #years span:hover {
            color: #000000;

            font-weight: bold;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 768px) {

            #chart {
                height: 65vh;

                min-height: 400px;
            }


            .controls {
                padding:
                    10px
                    15px
                    20px
                    15px;
            }


            .entity-dropdown-menu {
                width: 280px;
            }


            #currentTime {
                width: 100%;

                margin-left: 0;
            }


            #years span {
                font-size: 10px;
            }

        }

    </style>

</head>


<body>


<div class="bubble-container">


    <!-- ==============================
         GRÁFICA
    ============================== -->

    <div id="chart"></div>



    <!-- ==============================
         CONTROLES
    ============================== -->

    <div class="controls">


        <div class="control-row">


            <!-- PLAY -->

            <button
                id="play"
                type="button"
                class="btn btn-success"
            >

                ▶ Reproducir

            </button>



            <!-- PAUSA -->

            <button
                id="pause"
                type="button"
                class="btn btn-danger"
            >

                Ⅱ Pausar

            </button>



            <!-- ==========================
                 ENTIDADES
            ========================== -->

            <div class="dropdown">


                <button
                    id="entityDropdownButton"
                    class="btn btn-outline-secondary dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                >

                    Seleccionar entidades

                </button>



                <div
                    class="dropdown-menu entity-dropdown-menu"
                >


                    <!-- BUSCADOR -->

                    <input
                        id="entitySearch"
                        type="text"
                        class="form-control mb-2"
                        placeholder="Buscar entidad..."
                    >



                    <!-- BOTONES -->

                    <div class="entity-actions">


                        <button
                            id="selectAll"
                            type="button"
                            class="btn btn-sm btn-outline-primary"
                        >

                            Todas

                        </button>


                        <button
                            id="deselectAll"
                            type="button"
                            class="btn btn-sm btn-outline-secondary"
                        >

                            Ninguna

                        </button>


                    </div>



                    <!-- LISTADO -->

                    <div id="entityList"></div>



                    <!-- CONTADOR -->

                    <div id="entityCount">

                        0 entidades seleccionadas

                    </div>


                </div>


            </div>



            <!-- TIEMPO ACTUAL -->

            <span id="currentTime">

                -

            </span>


        </div>



        <!-- ==============================
             TIMELINE
        ============================== -->

        <input
            id="timeline"
            type="range"
            class="form-range"
            min="0"
            max="0"
            step="1"
            value="0"
        >



        <!-- ETIQUETAS -->

        <div id="years"></div>


    </div>


</div>



<!-- ==============================
     JS DE LA GRÁFICA
============================== -->

<script src="viewBubble.js"></script>


</body>

</html>
